name: traceability

# KISS-Conform §6.1/§6.2 as a CI gate. Two independent checks, both blocking:
#
#   1. document consistency — spec/ against itself (every clause names a test,
#      and the body tag agrees with the §9 matrix row);
#   2. binding — spec/ against conformance/, so a clause cannot name a test that
#      does not exist. Without this, check 1 is a cross-reference spellchecker
#      and the suite can report "every clause maps 1:1 to a test" while naming
#      tests that exist nowhere.
#
# The gate is ratcheted by conformance/UNBACKED.tsv: a NEW untested MUST fails
# the build, and a clause that becomes tested must be removed from the ledger.
# The `strict` job below is §6.2 as literally written — it is expected to fail
# until the ledger is empty, and it is reported rather than hidden.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kiss-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Clause↔test traceability + binding (ratcheted)
        run: python tools/kiss_trace.py --report
      # The gate's own discrimination controls: that it labels declared gates,
      # refuses to label an undeclared skip, and reports GATE-ONLY clauses with a
      # qualified figure. These landed in #141 and ran NOWHERE until now — the one
      # test proving the instrument can fail was itself never executed.
      - name: kiss_trace gate discovery + gate-only reporting (negative controls)
        run: python tools/test_kiss_trace_gates.py
      - name: Shared-enumeration consistency (dtype set + determinism enum)
        run: python tools/kiss_tables.py
      - name: Spec<->binding enumeration consistency (op-family set)
        run: python tools/kiss_vocab.py
      - name: KISS-Ops within-document op-set consistency
        run: python tools/kiss_ops.py
      - name: Wire-format spec<->binding consistency (magics, limits, decline codes)
        run: python tools/kiss_wire.py
      - name: KISS-Classify §6.1 dtype within-document consistency
        run: python tools/kiss_dtypes.py
      - name: dtype manifest (SSOT) is not stale
        run: |
          python tools/kiss_dtypes.py --emit-manifest
          git diff --exit-code conformance/corpus/dtype_manifest.json

  strict:
    # KISS-Conform §6.2 verbatim: the build fails on ANY untested normative MUST,
    # plus umbrella §5.3 condition 3 per sub-standard.
    #
    # Non-blocking BY DESIGN, and the reason matters: a gate that can never go
    # green — including for the commits that would fix it — gets bypassed by
    # habit, and decays back into a green check that means nothing. So an
    # untested MUST is reported here on every PR, and hard-fails the two
    # transitions it actually invalidates (a freeze, and a conformance claim)
    # rather than every commit. The number is the point; see UNBACKED.tsv.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Untested-MUST count (§6.2 target state)
        run: python tools/kiss_trace.py --strict
      - name: Freeze readiness (umbrella §5.3 condition 3)
        if: always()
        run: python tools/kiss_trace.py --freeze-ready
