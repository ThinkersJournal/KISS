name: traceability

# KISS-Conform §6.1/§6.2 as a CI gate. Two independent checks, both blocking:
#
#   1. document consistency — spec/ against itself (every clause names a test,
#      and the body tag agrees with the §9 matrix row);
#   2. binding — spec/ against conformance/, so a clause cannot name a test that
#      does not exist. Without this, check 1 is a cross-reference spellchecker
#      and the suite can report "every clause maps 1:1 to a test" while naming
#      tests that exist nowhere.
#
# The gate is ratcheted by conformance/UNBACKED.tsv: a NEW untested MUST fails
# the build, and a clause that becomes tested must be removed from the ledger.
# The `strict` job below is §6.2 as literally written — it is expected to fail
# until the ledger is empty, and it is reported rather than hidden.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kiss-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # depth 2 so the ratchet can read the pre-change ledger at HEAD^ on push-to-main;
          # the PR path fetches its base ref explicitly.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Clause↔test traceability + binding (ratcheted)
        run: python tools/kiss_trace.py --report
      # The gate's own discrimination controls: that it labels declared gates,
      # refuses to label an undeclared skip, and reports GATE-ONLY clauses with a
      # qualified figure. These landed in #141 and ran NOWHERE until now — the one
      # test proving the instrument can fail was itself never executed.
      - name: kiss_trace gate discovery + gate-only reporting (negative controls)
        run: python tools/test_kiss_trace_gates.py
      # The citation audit reports on the integrity of the coverage numbers, so its
      # OWN discrimination is what must run: the controls prove it does not simply
      # flag every reverse citation. The audit itself is non-gating by design — it
      # produces candidates to adjudicate, and a candidate is not a defect.
      # The coverage RATCHET. Unlike --strict (§6.2 verbatim, non-blocking because
      # it can never go green), this one CAN be green and therefore BLOCKS: it
      # compares harness/lint/untested against the committed floor and fails on any
      # deviation in either direction. Its own discrimination controls run first —
      # a ratchet that cannot go red is the same defect as one that is always red.
      - name: Coverage ratchet discrimination controls
        run: python tools/test_kiss_ratchet.py
      # The ratchet's CI STEP is shell inside YAML -- the least-tested code here: nothing
      # imports it and its only execution is on a runner, where a mistake shows up as a
      # confusing red rather than a failure. These controls EXTRACT the `run:` block and
      # EXECUTE it under `bash -e` with git/python stubbed, so a decline, a violation and a
      # failed base fetch are each proven distinguishable BY BEHAVIOUR, not by reading it.
      - name: Ratchet CI-step behavioural controls (#338)
        run: python tools/test_kiss_ratchet_step.py
      - name: Coverage ratchet (blocking)
        # The ratchet compares the lint SET against the PRE-change ledger read at a base ref,
        # so a lint->harness SUBSTITUTION and a constant-count swap can be told from a laundered
        # regression with the identical counts (#213). A base is passed on BOTH events — a
        # push-to-main run that cannot see a downgrade is the run nobody re-checks:
        #   PR:   the target branch (fetched first);
        #   push: HEAD^, the pre-merge tip (fetch-depth 2 on checkout makes it available).
        # A defaulted base is deliberately NOT used — it would compare against a stale tree.
        #
        # DO NOT SIMPLIFY THE BRANCH BELOW (#251). `--ratchet` returns THREE states:
        #   0 CLEAN · 1 VIOLATIONS FOUND (the floor moved) · 2 INCONCLUSIVE (it declined
        #   to answer, because no --base-ref was given).
        # Actions fails a step on ANY non-zero exit, so CI CANNOT DISTINGUISH 2 FROM 1: an
        # INCONCLUSIVE would present as a floor violation under a step named "blocking".
        # That never happens today only because a base is supplied on both events. Remove
        # or default the branch and every run becomes a refusal reported as a violation.
        # The echo below makes the red self-describing so the distinction survives anyway.
        run: |
          # `|| rc=$?` is LOAD-BEARING, not defensive: Actions runs a `run:` step under
          # `bash -e`, and a failing command inside an `if` BODY is not exempt from `-e`
          # (only the condition is). Without the `||` the script aborts at the python
          # line on exit 1 or 2 and the case below NEVER RUNS -- the message prints only
          # on success, which is the one state it is not needed for. An `||` list IS
          # exempt, so the code reaches `rc` and still propagates via the final `exit`.
          rc=0
          if [ -n "${{ github.base_ref }}" ]; then
            # CHECKED (#338). An unchecked fetch fails SILENTLY and resurfaces several
            # lines later as an exit-2 decline, where it is INDISTINGUISHABLE from the
            # ancestor case -- so the one cause the old `case` line asserted was likeliest
            # was also the one it could not tell apart from the others. Exit 3, its own
            # code, because a base that could not be fetched is neither a floor violation
            # nor a decline: the ratchet did not run at all.
            if ! git fetch --quiet origin "${{ github.base_ref }}"; then
              echo "::error title=Ratchet base fetch FAILED::could not fetch origin/${{ github.base_ref }} -- the ratchet DID NOT RUN. Not a floor violation and not a decline."
              exit 3
            fi
            python tools/kiss_trace.py --ratchet --base-ref "origin/${{ github.base_ref }}" || rc=$?
          else
            python tools/kiss_trace.py --ratchet --base-ref HEAD^ || rc=$?
          fi
          case $rc in
            0) echo "ratchet: exit 0 — CLEAN (at the floor)";;
            1) echo "::error title=Ratchet: FLOOR VIOLATION::exit 1 -- the floor moved. This is a real failure.";;
            2) echo "::error title=Ratchet: DECLINED (not a violation)::exit 2 -- INCONCLUSIVE: the ratchet could not characterize the lint dimension. NOT a floor violation. THE RATCHET PRINTS THE SPECIFIC CAUSE ABOVE -- read it. This line deliberately does not guess: it cannot observe which cause occurred, and the one it used to name as likeliest was wrong in the incident that found this (#338). Run kiss_trace.py --why-red for the reason set. See #251.";;
            *) echo "::error title=Ratchet: unexpected exit::exit $rc -- not one of the three documented states.";;
          esac
          exit $rc
      - name: Comparator-blindness discrimination controls
        run: python tools/test_kiss_comparators.py
      # A comparator that normalizes a dimension cannot fail on it. This gates the
      # DECLARATION half (KISS-CONFORM-6.8-0012): every clause naming a comparison
      # relation says what it is blind to, or is explicitly recorded as defining none.
      # The detector is over-broad and fails CLOSED, so a new comparator lands red
      # until someone classifies it -- which is the whole point.
      - name: Comparator-blindness lint (blocking)
        run: python tools/kiss_comparators.py
      - name: README coverage-binding controls (#266)
        run: python tools/test_kiss_readme_coverage.py
      # conformance/README.md's figures had aged apart from the ratcheted floor file in
      # the SAME directory -- 31 of 855 against harness 380 -- because one is maintained
      # by CI on every merge and the other by whoever last remembered. A number in a
      # README with no generator behind it does not fail; it ages. This reddens on drift.
      - name: README coverage figures match the tree (blocking)
        run: python tools/kiss_readme_coverage.py
      - name: Tolerated-red pin controls (#343)
        run: python tools/test_kiss_known_red.py
      # `strict` is continue-on-error BY DESIGN, so the run conclusion is SUCCESS even
      # when it is red -- "main is green" and "strict is failing on main" are both true
      # at once. This asserts the red is the DOCUMENTED one (untested MUSTs) and nothing
      # else, in the BLOCKING job, so a NEW strict failure reds something that gates.
      # It fails in both directions: strict PASSING means the tolerance is stale.
      - name: The tolerated `strict` red is the KNOWN one (blocking)
        run: python tools/kiss_trace.py --assert-known-red
      - name: RFC clause-id allocation controls (#342)
        run: python tools/test_kiss_rfc_allocations.py
      - name: Scoped-cite discrimination controls (16(e))
        run: python tools/test_kiss_scoped_cites.py
      # Convention 16(e) said this class was MECHANICALLY CHECKABLE and could have a
      # detector rather than only a rule -- and then went without one, while two people
      # who knew the rule broke it. A bare cross-document `§N.M` is ambiguous up to EIGHT
      # ways (`§6.6-0002`) and the author cannot see it: they resolve it unconsciously on
      # every re-read. Wiring it HERE is the point -- a detector nobody runs is the same
      # gap one layer out.
      - name: Bare cross-document §-cites (blocking)
        run: python tools/kiss_scoped_cites.py
      - name: Citation audit discrimination controls
        run: python tools/test_kiss_cites.py
      - name: Citation audit (reports; does not gate)
        run: python tools/kiss_cites.py
      - name: Shared-enumeration consistency (dtype set + determinism enum)
        run: python tools/kiss_tables.py
      - name: Spec<->binding enumeration consistency (op-family set)
        run: python tools/kiss_vocab.py
      - name: KISS-Ops within-document op-set consistency
        run: python tools/kiss_ops.py
      - name: Wire-format spec<->binding consistency (magics, limits, decline codes)
        run: python tools/kiss_wire.py
      - name: KISS-Classify §6.1 dtype within-document consistency
        run: python tools/kiss_dtypes.py
      - name: dtype manifest (SSOT) is not stale
        run: |
          python tools/kiss_dtypes.py --emit-manifest
          git diff --exit-code conformance/corpus/dtype_manifest.json
      # The op manifest had NO freshness gate, and that is how #154 hid: the §6.8
      # anchor drifted, the generator started returning `transcendental_atoms: []`,
      # and the committed file stayed correct only because nobody regenerated it.
      # Generator and artifact disagreed and nothing compared them.
      - name: op manifest (SSOT) is not stale
        run: |
          python tools/kiss_ops.py --emit-manifest
          git diff --exit-code conformance/corpus/op_manifest.json
      # The lints' OWN tests. Six test_*.py files sat in tools/ with no CI path;
      # one of them (test_kiss_ops_manifest.py) was RED on main, catching #154 in
      # silence. A test nobody runs is not coverage.
      # This step FAILS rather than skips in both degenerate cases, which is the
      # property that makes it evidence: a missing pytest exits 1 ("No module
      # named pytest"), and collecting ZERO tests exits 5 — so a rename that
      # empties the sweep goes red instead of reporting a silent success. Both
      # verified locally before wiring it.
      #
      # `pytest tools/ -q` exiting 0 says the sweep RAN. It says nothing about what
      # it COVERED, and those are two questions. `test_kiss_trace_gates.py` was a
      # pure script (`check()`/`main()`, no `test_*`), so pytest collected ZERO from
      # it and reported the other files' total: a step named "Lint self-tests"
      # silently skipping the one suite that proves the traceability instrument can
      # fail. #151 added a collectable wrapper AND the explicit script-mode step
      # above, which is why this is no longer live — but nothing stopped it
      # recurring for the next file, so the guard below closes the class.
      - name: Every tools/test_*.py contributes a collected test
        shell: bash
        run: |
          python -m pip install --quiet pytest
          for f in tools/test_*.py; do
            if ! python -m pytest "$f" --collect-only -q >/dev/null 2>&1; then
              echo "::error::$f collects ZERO tests — 'pytest tools/' would report"\
                   "success having never run it. Add a test_* wrapper, or invoke"\
                   "the file explicitly as a step."
              exit 1
            fi
          done
      - name: Lint self-tests (tools/)
        run: python -m pytest tools/ -q

  strict:
    # KISS-Conform §6.2 verbatim: the build fails on ANY untested normative MUST,
    # plus umbrella §5.3 condition 3 per sub-standard.
    #
    # Non-blocking BY DESIGN, and the reason matters: a gate that can never go
    # green — including for the commits that would fix it — gets bypassed by
    # habit, and decays back into a green check that means nothing. So an
    # untested MUST is reported here on every PR, and hard-fails the two
    # transitions it actually invalidates (a freeze, and a conformance claim)
    # rather than every commit. The number is the point; see UNBACKED.tsv.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # depth 2 so the ratchet can read the pre-change ledger at HEAD^ on push-to-main;
          # the PR path fetches its base ref explicitly.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Untested-MUST count (§6.2 target state)
        run: python tools/kiss_trace.py --strict
      - name: Freeze readiness (umbrella §5.3 condition 3)
        if: always()
        run: python tools/kiss_trace.py --freeze-ready
