name: conformance

# Runs the reference conformance harness (KISS-Conform §6.4/§6.7): the KISS-Ops
# OpAttrs reference encoder must reproduce every Ops Appendix E golden vector
# byte-for-byte, and must decline malformed blobs. ubuntu-latest ships Rust.
#
# The Windows leg additionally runs the §6.13-0006 differential slice: it compiles
# foreign C `add` kernels with MSVC and differences them against the CPU oracle
# through the KISS-Contract §6.5 C-ABI. That slice is #[cfg(windows)] and SKIPs
# where no C toolchain is present (so the ubuntu leg is unaffected); windows-latest
# ships MSVC + the Windows SDK, so there it actually executes.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reference conformance harness
        working-directory: conformance
        run: cargo test
      # What this leg actually COMPILED. `cfg` gates, features and the target
      # platform decide which tests exist in a binary, so this is a build fact
      # and cannot be recovered from source — see tools/kiss_runlist.py.
      - name: Capture the compiled test list
        working-directory: conformance
        shell: bash
        run: cargo test --quiet -- --list > ../runlist-ubuntu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: runlist-ubuntu
          path: runlist-ubuntu.txt

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reference conformance harness (Windows — runs the §6.13-0006 differential slice)
        working-directory: conformance
        run: cargo test
      # `shell: bash` deliberately: PowerShell's `>` has historically written
      # UTF-16, and a capture the reader cannot decode is a broken artifact
      # dressed as a passing step.
      - name: Capture the compiled test list
        working-directory: conformance
        shell: bash
        run: cargo test --quiet -- --list > ../runlist-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: runlist-windows
          path: runlist-windows.txt

  # Joins both legs' build artifacts against the clause matrix: every test that
  # backs a clause MUST be compiled by at least one leg. An audit that is not a
  # gate decays back to the state it found — this is what makes "does anything
  # run it?" a standing property instead of a one-off sweep.
  runlist:
    needs: [cargo-test, windows-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          name: runlist-ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: runlist-windows
      # The gate's own negative controls run FIRST. A gate that cannot fail
      # proves nothing about the suite it passes.
      - name: Gate discrimination controls
        run: python tools/test_kiss_runlist.py
      - name: Every clause-backing test is compiled on some leg
        run: |
          python tools/kiss_runlist.py \
            --leg ubuntu=runlist-ubuntu.txt \
            --leg windows=runlist-windows.txt
